name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages 需在 Repo Settings → Pages → Source=GitHub Actions 手動開一次
      # （GITHUB_TOKEN 無權代開：Resource not accessible by integration）
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload iis/ as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: iis
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
